<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Claude — Nova</title>
  <meta name="theme-color" content="#f7f7f8" />
  <script>
    // Deliberately inline and render-blocking. Any later than this and the
    // default theme paints first, producing a visible flash before the stored
    // preference is applied.
    try {
      var t = localStorage.getItem('nova.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" data-nav aria-label="Primary"></nav>

  <main class="page" id="main">
    <h1>Ask Claude</h1>
    <p class="lede">Multi-turn chat with Claude on Amazon Bedrock, streamed as it is generated.</p>

    <div class="alert" id="error" role="alert"></div>

    <div class="with-sidebar">
    <aside class="sidebar" aria-labelledby="saved-heading">
      <h2 id="saved-heading">Saved conversations</h2>
      <div class="button-row" style="margin-bottom:.6rem">
        <button id="import" type="button" class="secondary">Import…</button>
        <input type="file" id="import-file" accept="application/json,.json"
               class="visually-hidden" aria-label="Choose a conversation JSON file" />
      </div>
      <ul class="conversation-list" id="conversation-list"></ul>
      <p class="sidebar-empty" id="sidebar-empty">Nothing saved yet.</p>
    </aside>

    <div>
    <div class="card">
      <div class="row">
        <div class="field">
          <label for="preset">Response style</label>
          <select id="preset"></select>
          <p class="hint" id="preset-hint"></p>
        </div>
      </div>
      <div class="field" id="custom-field" hidden>
        <label for="custom-prompt">Custom system prompt</label>
        <textarea id="custom-prompt" rows="3"
          placeholder="You are a…"></textarea>
        <p class="hint"><span id="custom-count">0</span> / <span id="custom-max"></span> characters</p>
      </div>
    </div>

    <h2 id="transcript-heading">Conversation</h2>
    <div class="transcript" id="transcript" role="log" aria-live="polite"
         aria-labelledby="transcript-heading" tabindex="0">
      <p class="hint" id="empty-state">Nothing yet. Ask a question below.</p>
    </div>

    <div class="card" style="margin-top:1rem">
      <div class="field">
        <label for="input">Your message</label>
        <textarea id="input" rows="3" placeholder="Ask anything…"></textarea>
        <p class="hint">Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to send.</p>
      </div>
      <div class="button-row">
        <button id="send" type="button">Ask</button>
        <button id="stop" type="button" class="secondary" hidden>Stop</button>
        <button id="reset" type="button" class="secondary">New conversation</button>
        <button id="export-md" type="button" class="secondary" disabled>Export .md</button>
        <button id="export-json" type="button" class="secondary" disabled>Export .json</button>
        <button id="copy-all" type="button" class="secondary" disabled>Copy all</button>
        <span class="status" id="status" role="status" data-state="idle">Ready</span>
      </div>
      <p class="hint" id="usage-total" aria-live="polite"></p>
    </div>
    </div>
    </div>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/commands.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/presets.js"></script>
  <script src="/js/prompts.js"></script>
  <script src="/js/filename.js"></script>
  <script src="/js/conversations.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    (function () {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const transcript = $('transcript');
      const errorBox = $('error');
      const status = $('status');
      const input = $('input');
      const sendButton = $('send');
      const stopButton = $('stop');
      const resetButton = $('reset');
      const presetSelect = $('preset');
      const presetHint = $('preset-hint');
      const customField = $('custom-field');
      const customPrompt = $('custom-prompt');
      const customCount = $('custom-count');

      let selection = window.Presets.loadSelection();
      let currentAnswerEl = null;
      let autoScroll = true;

      $('custom-max').textContent = String(window.Presets.MAX_CUSTOM_LENGTH);

      // --- presets -------------------------------------------------------

      for (const preset of window.Presets.PRESETS) {
        const option = document.createElement('option');
        option.value = preset.id;
        option.textContent = preset.label;
        presetSelect.appendChild(option);
      }
      presetSelect.value = selection.id;
      customPrompt.value = selection.customPrompt;

      function syncPreset() {
        const preset = window.Presets.byId(presetSelect.value);
        presetHint.textContent = preset ? preset.description : '';
        customField.hidden = !preset?.custom;
        customCount.textContent = String(customPrompt.value.length);
      }

      presetSelect.addEventListener('change', () => {
        selection = { id: presetSelect.value, customPrompt: customPrompt.value };
        window.Presets.saveSelection(selection);
        syncPreset();
      });

      customPrompt.addEventListener('input', () => {
        customCount.textContent = String(customPrompt.value.length);
        selection = { id: presetSelect.value, customPrompt: customPrompt.value };
        window.Presets.saveSelection(selection);
      });

      syncPreset();

      // --- transcript ----------------------------------------------------

      transcript.addEventListener('scroll', () => {
        const atBottom =
          transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 40;
        autoScroll = atBottom;
      });

      function scroll() {
        if (autoScroll) transcript.scrollTop = transcript.scrollHeight;
      }

      function addTurn(who, label) {
        $('empty-state')?.remove();
        const turn = document.createElement('div');
        turn.className = `turn ${who}`;

        const heading = document.createElement('div');
        heading.className = 'who';
        heading.textContent = label;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        turn.append(heading, bubble);
        transcript.appendChild(turn);
        scroll();
        return { turn, bubble };
      }

      function addCopyButton(turn, getText) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'secondary';
        button.style.marginTop = '.5rem';
        button.textContent = 'Copy';
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(getText());
            button.textContent = 'Copied';
          } catch {
            button.textContent = 'Press Ctrl+C';
          }
          setTimeout(() => { button.textContent = 'Copy'; }, 1500);
        });
        turn.appendChild(button);
      }

      // --- chat ----------------------------------------------------------

      function setBusy(busy) {
        sendButton.disabled = busy;
        sendButton.textContent = busy ? 'Thinking…' : 'Ask';
        stopButton.hidden = !busy;
        resetButton.disabled = busy;
        status.dataset.state = busy ? 'thinking' : 'idle';
        status.textContent = busy ? 'Generating…' : 'Ready';
      }

      const chat = window.Chat.createChat({
        onDelta(_delta, full) {
          if (currentAnswerEl) {
            currentAnswerEl.innerHTML = window.Markdown.render(full);
            scroll();
          }
        },
      });

      // --- saved conversations -------------------------------------------

      const store = window.Conversations.createConversationStore({
        storage: window.localStorage,
        onEviction(count) {
          errorBox.textContent =
            `Storage was full, so ${count} older conversation(s) were removed.`;
        },
      });

      const listEl = $('conversation-list');
      const emptyEl = $('sidebar-empty');
      let activeId = null;
      let pendingUsage = null;

      function relative(timestamp) {
        const seconds = Math.round((Date.now() - timestamp) / 1000);
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      }

      function renderSidebar() {
        const conversations = store.list();
        listEl.replaceChildren();
        emptyEl.hidden = conversations.length > 0;

        for (const conversation of conversations) {
          const item = document.createElement('div');
          item.className = 'conversation-item';
          if (conversation.id === activeId) item.setAttribute('aria-current', 'true');

          const open = document.createElement('button');
          open.type = 'button';
          open.className = 'conversation-open';
          // textContent throughout: titles come from user messages.
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = conversation.title;
          const when = document.createElement('span');
          when.className = 'when';
          when.textContent = `${relative(conversation.updatedAt)} · ${conversation.messageCount} messages`;
          open.append(name, when);
          open.addEventListener('click', () => openConversation(conversation.id));

          const renameButton = document.createElement('button');
          renameButton.type = 'button';
          renameButton.className = 'conversation-action';
          renameButton.textContent = '✎';
          renameButton.setAttribute('aria-label', `Rename "${conversation.title}"`);
          renameButton.addEventListener('click', () => {
            const next = window.prompt('Conversation name', conversation.title);
            if (next !== null) {
              store.rename(conversation.id, next);
              renderSidebar();
            }
          });

          const removeButton = document.createElement('button');
          removeButton.type = 'button';
          removeButton.className = 'conversation-action remove';
          removeButton.textContent = '×';
          removeButton.setAttribute('aria-label', `Delete "${conversation.title}"`);
          removeButton.addEventListener('click', () => {
            if (!window.confirm(`Delete "${conversation.title}"? This cannot be undone.`)) return;
            store.remove(conversation.id);
            if (activeId === conversation.id) startNewConversation();
            renderSidebar();
          });

          item.append(open, renameButton, removeButton);
          const row = document.createElement('li');
          row.appendChild(item);
          listEl.appendChild(row);
        }
      }

      function renderTranscript(messages) {
        transcript.replaceChildren();
        if (messages.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'hint';
          empty.id = 'empty-state';
          empty.textContent = 'Nothing yet. Ask a question below.';
          transcript.appendChild(empty);
          return;
        }
        messages.forEach((message, index) => {
          const isUser = message.role === 'user';
          const { turn, bubble } = addTurn(isUser ? 'user' : 'assistant', isUser ? 'You' : 'Claude');
          if (isUser) bubble.textContent = message.content;
          else bubble.innerHTML = window.Markdown.render(message.content);
          addCopyButton(turn, () => message.content);
          addTurnActions(turn, index, message);
        });
      }

      function actionButton(label, describedAs, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'secondary';
        button.style.marginTop = '.5rem';
        button.style.marginLeft = '.35rem';
        button.textContent = label;
        button.setAttribute('aria-label', describedAs);
        button.addEventListener('click', onClick);
        return button;
      }

      function addTurnActions(turn, index, message) {
        if (message.role === 'assistant') {
          turn.appendChild(
            actionButton('Regenerate', 'Regenerate this answer', () => regenerate(index))
          );
        } else {
          turn.appendChild(
            actionButton('Edit', 'Edit this message and send it again', () => editTurn(index))
          );
        }
      }

      // Both actions are the same operation: truncate the history and send
      // again. Resisting a separate "edit mode" state machine is what keeps
      // this to a handful of lines.
      function truncateTo(index) {
        const kept = chat.getMessages().slice(0, index);
        chat.load(kept);
        if (activeId) store.save(activeId, kept);
        renderTranscript(kept);
        renderSidebar();
        updateExportButtons();
        return kept;
      }

      async function regenerate(index) {
        if (chat.isBusy()) return;
        const messages = chat.getMessages();
        const promptIndex = index - 1;
        if (messages[promptIndex]?.role !== 'user') return;

        const prompt = messages[promptIndex].content;
        // Drop the user turn too, because sendText re-adds it.
        truncateTo(promptIndex);
        await sendText(prompt);
      }

      function editTurn(index) {
        if (chat.isBusy()) return;
        const messages = chat.getMessages();
        const discarded = messages.length - index;

        if (discarded > 1 && !window.confirm(
          `Editing this message discards ${discarded} later message(s). Continue?`
        )) return;

        input.value = messages[index].content;
        truncateTo(index);
        input.focus();
      }

      function openConversation(id) {
        if (chat.isBusy()) return;
        const conversation = store.get(id);
        if (!conversation) return;

        activeId = id;
        chat.load(conversation.messages);
        renderTranscript(conversation.messages);
        renderSidebar();
        updateExportButtons();
        errorBox.textContent = '';
        input.focus();
      }

      function startNewConversation() {
        chat.reset();
        activeId = null;
        renderTranscript([]);
        renderSidebar();
        updateExportButtons();
        resetUsage();
        errorBox.textContent = '';
      }

      // Called after every completed turn. Creating on first message rather
      // than on page load is what stops empty shells accumulating.
      function persist(firstUserMessage) {
        const messages = chat.getMessages();
        if (messages.length === 0) return;

        if (activeId === null) {
          activeId = store.create(firstUserMessage, messages).id;
        } else {
          store.save(activeId, messages);
        }
        renderSidebar();
        updateExportButtons();
      }

      async function send() {
        const text = input.value.trim();
        if (!text) {
          errorBox.textContent = 'Please type a message first.';
          input.focus();
          return;
        }
        input.value = '';
        await sendText(text);
      }

      async function sendText(text) {
        errorBox.textContent = '';

        const preset = window.Presets.byId(presetSelect.value);
        if (preset?.custom && customPrompt.value.length > window.Presets.MAX_CUSTOM_LENGTH) {
          errorBox.textContent =
            `Custom system prompt must be ${window.Presets.MAX_CUSTOM_LENGTH} characters or fewer.`;
          return;
        }

        const user = addTurn('user', 'You');
        user.bubble.textContent = text;
        addCopyButton(user.turn, () => text);

        setBusy(true);

        const answer = addTurn('assistant', 'Claude');
        currentAnswerEl = answer.bubble;
        currentAnswerEl.innerHTML = '<p class="hint">…</p>';

        try {
          const result = await chat.send(text, {
            tone: window.Presets.resolvePrompt({
              id: presetSelect.value,
              customPrompt: customPrompt.value,
            }),
          });
          if (!result.text) {
            currentAnswerEl.innerHTML = '<p class="hint">No response.</p>';
          } else {
            addCopyButton(answer.turn, () => result.text);
          }
          // Deferred: the transcript is rebuilt in the finally block below,
          // which would discard a usage line appended here.
          pendingUsage = { usage: result.usage, cost: result.cost };
        } catch (err) {
          errorBox.textContent = err.message;
          if (!currentAnswerEl.textContent.trim() || currentAnswerEl.querySelector('.hint')) {
            answer.turn.remove();
          }
        } finally {
          currentAnswerEl = null;
          setBusy(false);
          // Persist whatever the exchange produced, including a partial answer
          // that was stopped part way - that is still something the user may
          // want back after a reload.
          persist(text);
          // Rebuild from the message array so every turn carries an action
          // button with the right index. Re-rendering beats patching indices
          // by hand, which is where off-by-ones live.
          renderTranscript(chat.getMessages());
          if (pendingUsage) {
            recordUsage(pendingUsage.usage, pendingUsage.cost);
            pendingUsage = null;
          }
          input.focus();
        }
      }

      sendButton.addEventListener('click', send);
      stopButton.addEventListener('click', () => chat.abort());
      resetButton.addEventListener('click', () => {
        startNewConversation();
        input.focus();
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          send();
        }
      });

      // --- token usage and cost --------------------------------------------

      const usageTotals = { input: 0, output: 0, cached: 0, cost: 0, priced: false };

      function formatCost(amount) {
        // Short turns genuinely cost fractions of a cent, so two decimal
        // places would render most of them as $0.00.
        if (amount >= 0.01) return `$${amount.toFixed(2)}`;
        if (amount > 0) return `$${amount.toFixed(5)}`;
        return '$0';
      }

      function recordUsage(usage, cost) {
        if (!usage) return;

        usageTotals.input += cost?.inputTokens ?? usage.input_tokens ?? 0;
        usageTotals.output += cost?.outputTokens ?? usage.output_tokens ?? 0;
        usageTotals.cached += cost?.cachedInputTokens ?? usage.cache_read_input_tokens ?? 0;
        if (cost && typeof cost.amount === 'number') {
          usageTotals.cost += cost.amount;
          usageTotals.priced = true;
        }

        const line = document.createElement('p');
        line.className = 'hint usage-line';
        const tokens =
          `${usageTotals.input ? '' : ''}${cost?.inputTokens ?? usage.input_tokens ?? 0} in · ` +
          `${cost?.outputTokens ?? usage.output_tokens ?? 0} out`;
        line.textContent =
          cost && typeof cost.amount === 'number'
            ? `${tokens} · ~${formatCost(cost.amount)} (estimate)`
            : `${tokens} · cost estimate unavailable (rates not configured)`;

        // Attach to the assistant turn that was just completed.
        const turns = transcript.querySelectorAll('.turn.assistant');
        turns[turns.length - 1]?.appendChild(line);

        renderUsageTotal();
      }

      function renderUsageTotal() {
        const target = $('usage-total');
        if (usageTotals.input + usageTotals.output === 0) {
          target.textContent = '';
          return;
        }
        const base =
          `${usageTotals.input.toLocaleString()} in · ` +
          `${usageTotals.output.toLocaleString()} out` +
          (usageTotals.cached ? ` · ${usageTotals.cached.toLocaleString()} cached` : '');
        target.textContent = usageTotals.priced
          ? `${base} · ~${formatCost(usageTotals.cost)} this conversation (estimate)`
          : `${base} · cost estimate unavailable`;
      }

      function resetUsage() {
        usageTotals.input = 0;
        usageTotals.output = 0;
        usageTotals.cached = 0;
        usageTotals.cost = 0;
        usageTotals.priced = false;
        renderUsageTotal();
      }

      // --- export / import ------------------------------------------------

      function currentConversation() {
        const messages = chat.getMessages();
        if (messages.length === 0) return null;
        const saved = activeId ? store.get(activeId) : null;
        return {
          title: saved?.title ?? window.Conversations.titleFrom(messages[0].content),
          messages,
        };
      }

      function updateExportButtons() {
        const has = chat.getMessages().length > 0;
        for (const id of ['export-md', 'export-json', 'copy-all']) {
          $(id).disabled = !has;
        }
      }

      function download(text, mimeType, filename) {
        const blob = new Blob([text], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      function exportName(conversation, extension) {
        return window.Filename.filenameFrom(
          `${conversation.title}-${window.Filename.timestamp()}`,
          extension,
          { fallback: 'conversation', maxLength: 60 }
        );
      }

      $('export-md').addEventListener('click', () => {
        const conversation = currentConversation();
        if (!conversation) return;
        download(
          window.Conversations.toMarkdown(conversation, { model: 'claude on bedrock' }),
          'text/markdown;charset=utf-8',
          exportName(conversation, 'md')
        );
      });

      $('export-json').addEventListener('click', () => {
        const conversation = currentConversation();
        if (!conversation) return;
        download(
          window.Conversations.toJson(conversation),
          'application/json;charset=utf-8',
          exportName(conversation, 'json')
        );
      });

      $('copy-all').addEventListener('click', async () => {
        const conversation = currentConversation();
        if (!conversation) return;
        const button = $('copy-all');
        try {
          await navigator.clipboard.writeText(
            window.Conversations.toMarkdown(conversation, { model: 'claude on bedrock' })
          );
          button.textContent = 'Copied';
        } catch {
          button.textContent = 'Copy failed';
        }
        setTimeout(() => { button.textContent = 'Copy all'; }, 1500);
      });

      $('import').addEventListener('click', () => $('import-file').click());

      $('import-file').addEventListener('change', async (event) => {
        const file = event.target.files?.[0];
        // Reset immediately so importing the same file twice still fires.
        event.target.value = '';
        if (!file) return;

        errorBox.textContent = '';
        const result = window.Conversations.fromJson(await file.text());
        if (!result.ok) {
          errorBox.textContent = `Could not import that file: ${result.error}`;
          return;
        }

        const created = store.create(
          result.title || result.messages[0]?.content || 'Imported conversation',
          result.messages
        );
        if (result.title) store.rename(created.id, result.title);
        openConversation(created.id);
      });

      // --- prompt library ---------------------------------------------------

      const promptStore = window.Prompts.createPromptStore({ storage: window.localStorage });

      function insertPrompt(prompt) {
        const names = window.Prompts.variablesIn(prompt.body);
        const values = {};

        for (const name of names) {
          const value = window.prompt(`Value for "${name}"`, '');
          // Cancelling any one variable abandons the whole insertion rather
          // than leaving a half-filled template in the composer.
          if (value === null) return;
          values[name] = value;
        }

        // Assigned to .value, never rendered as HTML.
        input.value = window.Prompts.fill(prompt.body, values);
        input.focus();
      }

      function registerPromptCommands() {
        for (const prompt of promptStore.list()) {
          window.Commands.register({
            id: `prompt.use.${prompt.id}`,
            label: `Prompt: ${prompt.name}`,
            hint: 'prompt library',
            run: () => insertPrompt(promptStore.get(prompt.id) ?? prompt),
          });
        }
      }

      window.Commands.register({
        id: 'prompt.save',
        label: 'Save the current message as a prompt',
        available: () => input.value.trim().length > 0,
        run() {
          const name = window.prompt('Name this prompt', '');
          if (name === null) return;
          promptStore.save({ name, body: input.value });
          registerPromptCommands();
          errorBox.textContent = '';
        },
      });

      window.Commands.register({
        id: 'prompt.manage',
        label: 'Delete a saved prompt',
        run() {
          const prompts = promptStore.list();
          const chosen = window.prompt(
            `Delete which prompt?\n\n${prompts.map((p, i) => `${i + 1}. ${p.name}`).join('\n')}\n\nEnter a number:`
          );
          const index = Number(chosen) - 1;
          if (!Number.isInteger(index) || index < 0 || index >= prompts.length) return;
          promptStore.remove(prompts[index].id);
          registerPromptCommands();
        },
      });

      window.Commands.register({
        id: 'prompt.export',
        label: 'Export the prompt library',
        run: () => download(promptStore.toJson(), 'application/json;charset=utf-8', 'prompts.json'),
      });

      registerPromptCommands();

      // --- commands ---------------------------------------------------------

      window.Commands.register({
        id: 'chat.new',
        label: 'New conversation',
        shortcut: 'mod+shift+o',
        worksWhileTyping: true,
        available: () => !chat.isBusy(),
        run: () => { startNewConversation(); input.focus(); },
      });

      window.Commands.register({
        id: 'chat.focus',
        label: 'Focus the message box',
        shortcut: 'mod+shift+l',
        worksWhileTyping: true,
        run: () => input.focus(),
      });

      window.Commands.register({
        id: 'chat.stop',
        label: 'Stop generating',
        shortcut: 'escape',
        worksWhileTyping: true,
        available: () => chat.isBusy(),
        run: () => chat.abort(),
      });

      window.Commands.register({
        id: 'chat.export.md',
        label: 'Export conversation as Markdown',
        available: () => chat.getMessages().length > 0,
        run: () => $('export-md').click(),
      });

      window.Commands.register({
        id: 'chat.export.json',
        label: 'Export conversation as JSON',
        available: () => chat.getMessages().length > 0,
        run: () => $('export-json').click(),
      });

      renderSidebar();
      updateExportButtons();
    })();
  </script>
</body>
</html>
